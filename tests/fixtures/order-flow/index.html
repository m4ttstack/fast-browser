<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Order flow fixture</title>
    <!--FIXTURE_VARIANT-->
    <!--FIXTURE_KILLTEST-->
  </head>
  <body>
    <!--FIXTURE_OVERLAY-->
    <main id="app">
      <button type="button" id="start-order">Start order</button>
    </main>
    <script>
      const VARIANT = window.__FIXTURE_VARIANT__ || 'base';
      const app = document.querySelector('#app');
      const state = { customer: '', plan: 'starter', seats: 1 };

      // WS4a Task 5 (at-most-once kill test): orthogonal to VARIANT above --
      // server.mjs's `setKillTest({ token, stall })` is a separate toggle
      // (a server MODE, not a mutation PROFILE) that injects these two
      // globals via the `<!--FIXTURE_KILLTEST-->` placeholder. Both are
      // `undefined` on every request no test ever opts into kill-test mode
      // for, so KILL_TEST_TOKEN reads null and every branch gated on it
      // below is dead code for every OTHER suite in this repo -- zero
      // behavior change, by construction, for anything that never calls
      // `setKillTest`.
      const KILL_TEST_TOKEN = window.__KILL_TEST_TOKEN__ || null;
      const KILL_TEST_STALL = window.__KILL_TEST_STALL__ === true;

      // The mutating POST itself: registered ONCE here, at `app`-level
      // delegation, rather than as a second direct listener inside
      // `showReview()`'s own `else` branch below. That branch's exact
      // source text (`PLACE_ORDER_LISTENER_CALL` and friends) is what four
      // of profiles.mjs's mutation profiles target with their own literal
      // `String#replace()` -- class-rename/text-rename-far in particular
      // additionally assert every reference to the OLD id-based place-order
      // query selector is GONE from their transformed output (deliberately
      // not spelling that selector out literally in THIS comment, for the
      // same reason -- a raw substring match over the whole page would
      // catch a comment quoting it just as readily as real code). A second,
      // independently-added query targeting that same id, sitting outside
      // what those `.replace()` calls target, would survive their
      // transform and falsely reintroduce it, breaking that assertion.
      // Delegation sidesteps this entirely: nothing inside
      // `showReview()`/`showComplete()` changes at all, so every existing
      // profile's own targeted diff stays exactly what it was before this
      // task. Click bubbles from the button (inserted later by
      // `showReview()`) up to `app`, which already exists in the page's
      // initial markup.
      if (KILL_TEST_TOKEN) {
        app.addEventListener('click', (event) => {
          if (event.target && event.target.id === 'place-order') {
            fetch('/order', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ token: KILL_TEST_TOKEN }),
            });
          }
        });
      }

      // WS3a Task 9 / WS3b Task 10 (healing e2e, tests/e2e/healing.test.mjs)
      // -- only a handful of behaviors in this whole script are
      // variant-conditional; every element the 'base'-variant recording
      // script (flows.test.mjs/sites.test.mjs's own script, which never
      // varies) actually interacts with is byte-identical across every
      // variant, so tests/e2e/sites.test.mjs's pinned locator-kind
      // assertions (mined from that recording) are untouched by any of this
      // file's variant branches, including the two WS3b Task 10 adds below.
      //
      // 'overlay': a consent banner covers the page and the underlying
      // #app is held `visibility: hidden` until `#consent-accept` is
      // clicked -- see tests/e2e/healing.test.mjs's own doc comment for why
      // this uses `visibility`, not just a higher z-index, to genuinely
      // fail flow-runner's locator probe (Playwright's `waitFor({state:
      // 'visible'})` -- what that probe calls -- checks bounding-box/CSS
      // visibility only, never pointer-event occlusion).
      // `window.__consentDismissClicks__` (WS4a Task 4): mirrors the
      // 'intercept' branch's own `__interceptDismissClicks__` below --
      // added per the drift-harness rung-distribution matrix's ledger
      // ruling that a successful quirk-driven dismissal here needs its own
      // directly countable fixture-side evidence, not just the escalated
      // fallback entry the runner's post-quirk retry also happens to leave
      // behind (that entry alone cannot distinguish "a quirk recovered
      // this" from "the retry would have succeeded regardless").
      if (VARIANT === 'overlay') {
        app.style.visibility = 'hidden';
        window.__consentDismissClicks__ = 0;
        document.querySelector('#consent-accept').addEventListener('click', () => {
          window.__consentDismissClicks__ += 1;
          document.querySelector('#consent-overlay').remove();
          app.style.visibility = 'visible';
        });
      }

      // WS3b Task 10 (tests/fixtures/order-flow/server.mjs's own doc
      // comment has the full write-up): unlike 'overlay' above, #app's own
      // visibility/display is never touched here -- #intercept-overlay
      // alone (a separate, explicitly z-indexed element) is what blocks
      // the click, and removing it is the whole dismissal.
      // `window.__interceptDismissClicks__` is read back via
      // `browser_evaluate` at the end of tests/e2e/healing.test.mjs's own
      // interception leg -- direct, observable proof (not merely an
      // inference from the runner's own "at most one quirk attempt per
      // step" doc comment) that the quirk fired exactly once, never
      // retried.
      if (VARIANT === 'intercept') {
        window.__interceptDismissClicks__ = 0;
        document.querySelector('#intercept-dismiss').addEventListener('click', () => {
          window.__interceptDismissClicks__ += 1;
          document.querySelector('#intercept-overlay').remove();
        });
      }

      function orderId() {
        return `${state.customer.trim().toUpperCase()}-${state.plan.toUpperCase()}-${state.seats}`;
      }

      function showCustomer() {
        app.innerHTML = `
          <label>Customer name <input name="customer" type="text"></label>
          <button type="button" id="continue">Continue</button>
        `;
        document.querySelector('[name="customer"]').focus();
        document.querySelector('#continue').addEventListener('click', () => {
          state.customer = document.querySelector('[name="customer"]').value;
          showPlan();
        });
      }

      function showPlan() {
        app.innerHTML = `
          <label>Plan
            <select name="plan">
              <option value="starter">Starter</option>
              <option value="team">Team</option>
              <option value="scale">Scale</option>
            </select>
          </label>
          <label>Seats <input name="seats" type="number" min="1" value="1"></label>
          <button type="button" id="review">Review order</button>
        `;
        const plan = document.querySelector('[name="plan"]');
        const seats = document.querySelector('[name="seats"]');
        plan.addEventListener('change', () => { state.plan = plan.value; });
        document.querySelector('#review').addEventListener('click', () => {
          state.plan = plan.value;
          state.seats = Number(seats.value);
          showReview();
        });
      }

      // 'drifted': the ONE element whose markup itself changes shape. The
      // base/overlay branch keeps the exact original <button id="place-
      // order"> (no data-testid) so its recorded role+css locators are
      // untouched; the drifted branch swaps it for an <a> (no native
      // "button" ARIA role, so flow-runner's role-based locator genuinely
      // misses) carrying a fresh data-testid and no id (so the css locator
      // also misses), while keeping the exact same visible text "Place
      // order" -- heal.mjs's lexical ranking scores a healed candidate
      // against the target's recorded NAME, and this is what keeps that
      // score high despite the tag/id change. See
      // tests/e2e/healing.test.mjs for the full write-up.
      // 'role-drifted' (WS3b Task 10): the ONE element whose markup itself
      // changes shape for the role+text heal leg -- every other element,
      // INCLUDING "Place order", stays exactly 'base' shape, mirroring how
      // 'drifted' above isolates ITS OWN one-element change. The base/
      // every-other-variant branch is a plain native button with an id (no
      // `data-testid`, no `role`/`aria-label` attribute -- a heal here can
      // only ever come from role+text).
      //
      // Why REWORDING, not hiding, is what makes the recorded locator walk
      // miss: flow-runner.js's `candidateLocator` resolves a step's 'role'
      // kind candidate via `page.getByRole(target.role, {name:
      // target.name})` -- a query for role+ACCESSIBLE-NAME, evaluated fresh
      // against the LIVE page every time, completely independent of the
      // literal recorded selector string or the target element's identity/
      // position. That query is IDENTICAL on the original (pre-heal) replay
      // and the healed replay (the healed alternate is also role+name-
      // based, synthesized as `internal:role=button[name="<observed
      // text>"i]` -- see heal.mjs's `synthesizeLocator`), so anything that
      // makes role+accessible-name resolution genuinely, permanently fail
      // (an explicit `role`/`aria-label` override, `aria-hidden`, a
      // `display:none`/zero-size box) makes BOTH replays fail identically
      // -- there is no page-state difference between the two calls for a
      // static variant to exploit (confirmed empirically before settling on
      // this approach: an `aria-hidden` version of this same idea defeats
      // its own heal for exactly this reason). What actually creates the
      // needed asymmetry is the SAME thing that makes the testid heal above
      // work: the healed locator must query for something the ORIGINAL
      // recording never had. Here, `id="confirm-order"` is dropped (the
      // recorded css locator misses) AND the button's wording changes from
      // "Confirm order" to "Confirm your order" -- inserting a word
      // mid-string, not merely appending/prepending one, is what defeats
      // `getByRole`'s own default substring+case-insensitive name matching
      // (verified directly against the real runtime: "confirm order" is
      // NOT a substring of "confirm your order", so a query for the
      // ORIGINAL recorded name -- "Confirm order" -- misses; a fresh query
      // for the CURRENT observed text -- "Confirm your order", exactly what
      // `collectCandidates`'s raw `innerText` read at heal time recovers
      // and `synthesizeLocator` embeds verbatim -- matches immediately).
      // Both words survive as distinct, case-insensitive-alphanumeric
      // tokens (heal.mjs's own `tokenize`/`jaccard`), so lexical ranking
      // still scores this candidate well clear of `HEAL_MIN_SCORE`/
      // `HEAL_MIN_MARGIN` against "Place order" as the only other
      // candidate on this screen -- "role+text evidence survives" in the
      // sense that matters (the heal fires from it, correctly, over the
      // reworded text), even though the literal string is no longer
      // byte-identical to the base recording's.
      function showReview() {
        app.innerHTML = `
          <h1>Review order</h1>
          <p>${state.customer} — ${state.plan} — ${state.seats}</p>
        `;
        if (VARIANT === 'role-drifted') {
          app.insertAdjacentHTML('beforeend', '<button type="button">Confirm your order</button>');
        } else {
          app.insertAdjacentHTML('beforeend', '<button type="button" id="confirm-order">Confirm order</button>');
        }
        if (VARIANT === 'drifted') {
          app.insertAdjacentHTML('beforeend', '<a class="order-action" data-testid="submit-v2">Place order</a>');
          document.querySelector('.order-action').addEventListener('click', showComplete);
        } else {
          app.insertAdjacentHTML('beforeend', '<button type="button" id="place-order">Place order</button>');
          document.querySelector('#place-order').addEventListener('click', showComplete);
        }
      }

      function showComplete() {
        app.innerHTML = '<h1>Order complete</h1><p data-testid="order-id"></p>';
        document.querySelector('[data-testid="order-id"]').textContent = orderId();
        // WS4a Task 5's own stall mechanism: "the client script never
        // renders the next element" (the brief's own second documented
        // option, chosen over holding an HTTP response open -- see
        // server.mjs's doc comment for why). When KILL_TEST_STALL is true,
        // the mutating action above has already fired for real (the POST
        // already completed by the time this function runs) -- only the
        // FOLLOWING interactive element (what the compiled kill-test flow's
        // own next step targets) is withheld, indefinitely: nothing here
        // ever times out or retries this render from the client side.
        if (KILL_TEST_TOKEN && !KILL_TEST_STALL) {
          app.insertAdjacentHTML('beforeend', '<button type="button" id="confirm-receipt">Confirm receipt</button>');
          document.querySelector('#confirm-receipt').addEventListener('click', () => {
            app.innerHTML = '<p>Receipt confirmed</p>';
          });
        }
      }

      document.querySelector('#start-order').addEventListener('click', showCustomer);
    </script>
  </body>
</html>
