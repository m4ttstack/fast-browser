<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9}
.panel{margin:40px;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;width:420px}
.name{display:inline-block;font-weight:600;font-size:16px}
.chip{display:block;margin:6px 0 0 150px;width:86px;padding:3px 0;border-radius:10px;background:#e0e7ff;color:#312e81;text-align:center;font-size:11px;font-weight:600}
.meta{margin-top:30px;color:#666}</style>
<div class="panel"><h3>Example services</h3>
  <span class="name" data-testid="name">Example Service Alpha</span>
  <span class="chip" data-testid="chip">Monitored</span>
  <div class="meta">Updated today by the example team</div>
</div>
