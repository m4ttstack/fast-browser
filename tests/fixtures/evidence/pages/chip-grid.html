<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9}
.panel{margin:40px;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;width:420px}
.grid{display:grid;grid-template-columns:repeat(2,140px);gap:20px 24px;margin-top:12px}
.chip{display:block;padding:6px 14px;border-radius:14px;background:#e0e7ff;color:#312e81;text-align:center;font-weight:600}</style>
<div class="panel"><h3>Release checks</h3>
  <div class="grid">
    <span class="chip" data-testid="a1">Lint</span><span class="chip" data-testid="b1">Build</span>
    <span class="chip" data-testid="a2">Unit</span><span class="chip" data-testid="b2">Docs</span>
    <span class="chip" data-testid="a3">Audit</span><span class="chip" data-testid="b3">Deploy</span>
  </div>
</div>
