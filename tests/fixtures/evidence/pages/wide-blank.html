<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#fff;color:#111827}
.card{box-sizing:border-box;width:900px;margin:40px;padding:18px 20px;background:#fff;border:1px solid #d1d5db;border-radius:4px}
.head{display:flex;align-items:center;gap:12px}
.icon{flex:none;width:18px;height:18px;border-radius:4px;background:#6366f1}
.name{font-weight:600;font-size:16px}
.gap{flex:none;width:40px;height:24px}
.chip{flex:none;padding:3px 10px;border-radius:10px;background:#e0f2fe;color:#075985;font-size:12px}
.meta{margin-top:10px;color:#475569}</style>
<div class="card" data-testid="card">
  <div class="head"><span class="icon"></span><span class="name">Checklist</span><span class="gap" data-testid="gap"></span><span class="chip">Draft, due next Friday</span></div>
  <div class="meta">Updated today</div>
</div>
