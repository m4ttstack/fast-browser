<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#fff;color:#0f172a}.wrap{margin:40px;width:792px}
.strip{display:flex;align-items:flex-end;gap:16px;padding:12px 16px 0;width:760px;border-bottom:1px solid #cbd5e1;background:#fff}
.tab{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;color:#64748b;font-weight:600}
.tab.active{margin-bottom:-1px;border:1px solid #cbd5e1;border-bottom-color:#fff;border-radius:10px 10px 0 0;color:#0f172a;background:#fff}
.avatar{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:12px}
.who{display:flex;flex-direction:column;gap:4px}.chips{display:flex;gap:6px}
.chip{padding:1px 8px;border-radius:9px;background:#dcfce7;color:#166534;font-size:11px;font-weight:600}.chip.due{background:#fef3c7;color:#92400e}
