<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9;color:#111827}
.app{display:flex;width:900px;height:680px;background:#fff}
.nav{width:180px;padding:24px 20px;background:#f3f4f6;box-sizing:border-box}
.nav div{padding:10px 0;color:#4b5563}
.nav .far{margin-top:400px}
.main{flex:1;padding:24px 28px}
.bar{display:flex;justify-content:space-between;align-items:center;height:44px}
button{font:inherit;height:32px;padding:0 14px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
.row{display:flex;align-items:center;height:56px;border-bottom:1px solid #e5e7eb}
.row .name{width:260px}.row .who{width:150px;color:#6b7280}</style>
<div class="app" data-testid="tracker">
  <div class="nav"><div>Projects</div><div>Tasks</div><div class="far" data-testid="reports">Reports</div></div>
  <div class="main">
    <div class="bar"><h3 style="margin:0" data-testid="project">Atlas rewrite</h3><button data-testid="new-task">New task</button></div>
    <div class="row"><span class="name">Draft the release notes</span><span class="who">Pat Example</span></div>
    <div class="row"><span class="name">Review the import flow</span><span class="who">Pat Example</span></div>
  </div>
</div>
