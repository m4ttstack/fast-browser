<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f1f5f9}
section{box-sizing:border-box;margin:40px;width:720px;border:1px solid #cbd5e1;background:#fff}
h3{margin:0;font-size:18px}
.row{display:flex;margin:14px 0 16px 16px}
.service{display:flex;gap:10px;width:300px}
.thumb{flex:none;width:40px;height:40px;background:#94a3b8}
p{margin:0;font-size:13px;line-height:20px}
.name{font-weight:700}</style>
<section data-testid="services"><h3>Services and owners</h3>
  <div class="row">
    <div class="service"><div class="thumb"></div><div><p class="name">Tracker API</p><p data-testid="api-state">Owner on plan</p></div></div>
    <div class="service"><div class="thumb"></div><div><p class="name">Billing worker</p><p data-testid="worker-state">Owner unknown</p></div></div>
  </div>
</section>
