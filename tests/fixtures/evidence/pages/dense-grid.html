<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9}
.card{box-sizing:border-box;margin:40px;width:900px;padding:20px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
h3{margin:0 0 10px;font-size:16px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);column-gap:16px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:center;height:28px}
svg{flex:none}</style>
