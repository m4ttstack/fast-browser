<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9;color:#111827}
.card{margin:40px;width:360px;padding:16px 20px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
h3{margin:0 0 12px;font-size:16px}
.tools{display:flex;gap:10px;align-items:center}
.tool{width:14px;height:14px;border-radius:3px;background:#64748b}
.gap{width:14px;height:14px}
p{margin:12px 0 0;color:#6b7280}</style>
<div class="card" data-testid="card"><h3>Issue toolbar</h3>
  <div class="tools"><span class="tool"></span><span class="tool"></span><span class="gap" data-testid="gap"></span><span class="tool"></span><span class="tool"></span></div>
  <p>Four tools show where five should.</p>
</div>
