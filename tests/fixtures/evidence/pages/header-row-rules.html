<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#fff;color:#111827}
.row{box-sizing:border-box;width:720px;margin:40px;padding:12px 0 12px 16px}
.rule{height:1px;background:#e5e7eb;margin-right:-120px}
.line{display:flex;gap:14px;align-items:center;padding:12px 0}
.thumb{flex:none;width:72px;height:40px;border-radius:6px;background:#cbd5e1}
.name{font-weight:600;font-size:16px}
.badge{display:inline-block;width:14px;height:14px;margin-left:8px;border-radius:3px;background:#2563eb;vertical-align:middle}
.meta{margin-top:6px;color:#475569}</style>
<div class="row" data-testid="row"><div class="rule"></div>
<div class="line"><span class="thumb"></span>
<div data-testid="content"><div class="name">Nightly build 4821<span class="badge" data-testid="badge"></span></div><div class="meta">Passed on main, signed, cached and uploaded to the mirror</div></div></div>
<div class="rule"></div></div>
