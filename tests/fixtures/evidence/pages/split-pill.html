<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9}
.board{margin:40px;padding:24px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
.pill{display:inline-flex;align-items:center;margin-top:12px;padding:8px 16px 8px 18px;border-radius:999px;background:#e0e7ff}
.name{padding-right:30px}
.chip{margin-left:-30px;padding:5px 12px;border-radius:999px;color:#fff;font-weight:700;background:linear-gradient(#1e3a8a 50%,#3b82f6 50%)}</style>
<div class="board"><h3>Release train</h3>
  <div class="pill"><span class="name" data-testid="pill-name">Stable channel</span><span class="chip" data-testid="pill-chip">v2.4</span></div>
</div>
