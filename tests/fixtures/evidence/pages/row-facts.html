<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:14px Helvetica,Arial,sans-serif;background:#f6f7f9}
.card{box-sizing:border-box;margin:40px;width:560px;padding:20px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}
h3{margin:0 0 8px;font-size:16px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e5e7eb}
li span{display:block;flex:1}
svg{flex:none}</style>
<div class="card" data-testid="checks"><h3>Deploy checks</h3>
  <ul>
    <li><svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="Passed"><circle cx="7" cy="7" r="7" fill="#16a34a"/><path d="M3.5 7.2l2.4 2.3 4.6-4.8" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span data-testid="build">Build passed</span></li>
    <li><svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="Passed"><circle cx="7" cy="7" r="7" fill="#16a34a"/><path d="M3.5 7.2l2.4 2.3 4.6-4.8" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span data-testid="tests">Tests passed</span></li>
    <li><svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="Passed"><circle cx="7" cy="7" r="7" fill="#16a34a"/><path d="M3.5 7.2l2.4 2.3 4.6-4.8" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span data-testid="lint">Lint passed</span></li>
    <li><svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="Passed"><circle cx="7" cy="7" r="7" fill="#16a34a"/><path d="M3.5 7.2l2.4 2.3 4.6-4.8" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span data-testid="staging">Deployed to staging</span></li>
  </ul>
</div>
